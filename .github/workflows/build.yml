name: Build GitLens

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "上游正式版本标签, 例如 v19.3.0. 留空使用最新正式版"
        required: false
        type: string
      force:
        description: "强制重建并替换已有 Release 的产物"
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # 前置任务: 确定上游版本, 判断已有 Release 是否需要跳过.
  prepare:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - name: Resolve upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          FORCE_BUILD: ${{ inputs.force }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(gh api repos/gitkraken/vscode-gitlens/releases/latest --jq '.tag_name')
          fi

          # 推送始终构建; 定时和手动运行在 Release 已存在时跳过, force 可强制重建.
          should_build=true
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$FORCE_BUILD" != "true" ] &&
             gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            should_build=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  # 构建任务: 拉取上游, 应用补丁, 使用上游工具链打包 VSIX.
  build:
    name: Package VSIX
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # 按解析出的上游标签检出源码, .work 路径将其与本仓库文件隔离.
      - name: Checkout GitLens
        uses: actions/checkout@v7.0.1
        with:
          repository: gitkraken/vscode-gitlens
          ref: refs/tags/${{ needs.prepare.outputs.version }}
          path: .work/gitlens

      # 使用所选 GitLens 版本在 package.json 中声明的 Node.js 要求.
      - name: Setup upstream Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .work/gitlens/package.json

      # pnpm 版本同样取自上游 package.json.
      - name: Setup upstream pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: .work/gitlens/package.json

      # 按文件名顺序应用补丁, git apply 失败时步骤直接终止.
      - name: Apply patches
        working-directory: .work/gitlens
        run: |
          for patch in ../../patches/*.patch; do
            git apply "$patch"
          done

      - name: Install upstream dependencies
        working-directory: .work/gitlens
        run: pnpm install --frozen-lockfile

      # 调用上游打包命令, 将 VSIX 输出到本仓库的 dist 目录.
      - name: Package extension
        working-directory: .work/gitlens
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p ../../dist
          pnpm run package --out "../../dist/gitlens-${VERSION#v}.vsix"

      # 保存本次构建产物, 供用户下载及后续 publish job 获取.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gitlens-${{ needs.prepare.outputs.version }}
          path: dist/*.vsix

  # 发布任务: 构建成功且由定时或手动触发时执行, 推送构建只生成 Artifact.
  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 发布 Release 需要仓库写权限.
    permissions:
      contents: write
    steps:
      # 下载本次工作流运行中由 build 上传的产物.
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: gitlens-${{ needs.prepare.outputs.version }}
          path: dist

      # Release Action 创建或更新该版本, 重建时替换同名 VSIX.
      - name: Publish release assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GitLens ${{ needs.prepare.outputs.version }}
          body: 基于 [GitLens ${{ needs.prepare.outputs.version }}](https://github.com/gitkraken/vscode-gitlens/releases/tag/${{ needs.prepare.outputs.version }}) 应用本仓库补丁构建.
          files: dist/*.vsix
